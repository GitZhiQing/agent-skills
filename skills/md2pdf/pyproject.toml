[project]
name = "md2pdf"
version = "0.1.0"
description = "Markdown → 精美 PDF：双版式 × 多主题，Agent 优先，Human-in-the-loop"
requires-python = ">=3.11"
dependencies = [
    "markdown-it-py[linkify]>=3.0",
    "mdit-py-plugins>=0.4",
    "pygments>=2.17",
    "jinja2>=3.1",
    "playwright>=1.40",
    "pymupdf>=1.24",
    "pyyaml>=6.0",
    "trafilatura>=1.8",
    "pillow>=12.3.0",
]

[project.scripts]
md2pdf = "md2pdf.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/md2pdf"]
