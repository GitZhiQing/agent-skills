[project]
name = "ddgs-web-access"
version = "0.2.0"
description = "Minimal web search & web fetch CLI for AI coding agents, wrapping ddgs (DuckDuckGo metasearch)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "ddgs>=9.15,<10",
    "markdownify>=1.2.3",
]

[project.scripts]
ddgs-web-search = "ddgs_web_access:web_search_main"
ddgs-web-fetch = "ddgs_web_access:web_fetch_main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["ddgs_web_access"]
