[project]
name = "api-web-access"
version = "0.1.1"
description = "Stable web search & fetch CLI backed by the Tavily and Exa APIs, with automatic provider failover."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.scripts]
api-web-search = "api_web_access:web_search_main"
api-web-fetch = "api_web_access:web_fetch_main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["api_web_access"]
