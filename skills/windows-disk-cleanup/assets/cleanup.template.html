<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>__TITLE__</title>
<style>
  :root {
    --bg: #fafafa;
    --fg: #18181b;
    --muted: #71717a;
    --muted-2: #a1a1aa;
    --card: #ffffff;
    --border: #e4e4e7;
    --hover: #f4f4f5;
    --bar-bg: #e4e4e7;
    --danger: #dc2626;
    --font-sans: "Inter", system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Consolas, "Courier New", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #09090b;
      --fg: #f4f4f5;
      --muted: #a1a1aa;
      --muted-2: #71717a;
      --card: #18181b;
      --border: #27272a;
      --hover: #27272a;
      --bar-bg: #27272a;
      --danger: #f87171;
    }
  }
  * { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: rgba(161, 161, 170, 0.35) transparent; }
  *::-webkit-scrollbar { width: 8px; height: 8px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb { background: rgba(161, 161, 170, 0.35); border-radius: 999px; border: 2px solid transparent; background-clip: content-box; }
  *::-webkit-scrollbar-thumb:hover { background-color: rgba(113, 113, 122, 0.55); }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    font-size: 13px;
  }
  h1, h2, h3, p { margin: 0; }
  .wrap { max-width: 80rem; margin: 0 auto; padding: 24px 16px; }
  .card { border: 1px solid var(--border); border-radius: 10px; background: var(--card); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04); }
  .hero { padding: 20px; }
  .eyebrow { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.18em; color: var(--muted-2); }
  .hero h1 { margin-top: 4px; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
  .root-line { display: inline-flex; align-items: center; gap: 8px; margin-top: 4px; }
  .root-tag { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; color: var(--muted-2); }
  .root-path { display: inline-block; word-break: break-all; border-radius: 6px; background: var(--hover); padding: 2px 8px; font-family: var(--font-mono); font-size: 12px; }
  .meta-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; border-radius: 6px; background: var(--hover); padding: 2px 8px; font-size: 11px; color: var(--muted); }
  .chip strong { color: var(--fg); font-weight: 600; }
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 16px; }
  .stat-card { padding: 16px; border-left-width: 4px; border-left-style: solid; }
  .accent-emerald { border-left-color: #10b981; }
  .accent-zinc { border-left-color: #a1a1aa; }
  .accent-red { border-left-color: #ef4444; }
  .stat-label { font-size: 12px; font-weight: 500; color: var(--muted); }
  .stat-value { margin-top: 4px; font-size: 24px; font-weight: 600; letter-spacing: -0.02em; }
  .stat-sub { margin-top: 4px; font-size: 11px; color: var(--muted-2); }
  .volumes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 16px; }
  .volume-card { padding: 16px; }
  .volume-card h3 { font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted-2); }
  .track { height: 8px; margin-top: 12px; overflow: hidden; border-radius: 999px; background: var(--bar-bg); }
  .track > div { height: 100%; width: 0; border-radius: 999px; transition: width 0.5s ease; }
  .volume-row { display: flex; justify-content: space-between; margin-top: 8px; font-size: 12px; color: var(--muted); }
  .volume-row strong { color: var(--fg); font-weight: 600; }
  .results { margin-top: 16px; overflow: hidden; }
  .results-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--border); padding: 12px 16px; }
  .results-head h2 { font-size: 14px; font-weight: 600; }
  .link { color: #0284c7; font-size: 12px; font-weight: 500; text-decoration: none; }
  .link:hover { text-decoration: underline; }
  @media (prefers-color-scheme: dark) { .link { color: #38bdf8; } }
  .table-scroll { overflow-x: auto; }
  table { width: 100%; min-width: 760px; border-collapse: collapse; text-align: left; font-size: 12px; }
  thead { background: var(--hover); }
  thead tr { border-bottom: 1px solid var(--border); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted-2); }
  th { padding: 10px 12px; font-weight: 500; }
  tbody tr { border-bottom: 1px solid var(--border); vertical-align: top; }
  tbody tr:last-child { border-bottom: 0; }
  tbody tr:hover { background: var(--hover); }
  td { padding: 10px 12px; }
  .cell-path { max-width: 28rem; }
  .item-title { font-weight: 500; }
  .item-path { margin-top: 2px; word-break: break-all; font-family: var(--font-mono); font-size: 11px; color: var(--muted-2); }
  .item-error { margin-top: 4px; word-break: break-word; font-size: 11px; color: var(--danger); }
  .right { text-align: right; }
  .mono { font-family: var(--font-mono); }
  .nowrap { white-space: nowrap; }
  .badge { display: inline-flex; align-items: center; border-radius: 999px; padding: 1px 8px; font-size: 11px; font-weight: 500; line-height: 16px; }
  .badge-ok { background: #d1fae5; color: #065f46; box-shadow: inset 0 0 0 1px rgba(5, 150, 105, 0.2); }
  .badge-warn { background: #fef3c7; color: #92400e; box-shadow: inset 0 0 0 1px rgba(217, 119, 6, 0.25); }
  .badge-bad { background: #fee2e2; color: #991b1b; box-shadow: inset 0 0 0 1px rgba(220, 38, 38, 0.2); }
  .badge-muted { background: #f4f4f5; color: #52525b; box-shadow: inset 0 0 0 1px rgba(113, 113, 122, 0.2); }
  .badge-mode-recycle { background: #e0f2fe; color: #075985; box-shadow: inset 0 0 0 1px rgba(2, 132, 199, 0.2); }
  .badge-mode-permanent { background: #fee2e2; color: #991b1b; box-shadow: inset 0 0 0 1px rgba(220, 38, 38, 0.2); }
  @media (prefers-color-scheme: dark) {
    .badge-ok { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; box-shadow: inset 0 0 0 1px rgba(52, 211, 153, 0.2); }
    .badge-warn { background: rgba(245, 158, 11, 0.15); color: #fcd34d; box-shadow: inset 0 0 0 1px rgba(251, 191, 36, 0.2); }
    .badge-bad { background: rgba(239, 68, 68, 0.15); color: #fca5a5; box-shadow: inset 0 0 0 1px rgba(248, 113, 113, 0.2); }
    .badge-muted { background: #27272a; color: #a1a1aa; box-shadow: inset 0 0 0 1px rgba(161, 161, 170, 0.2); }
    .badge-mode-recycle { background: rgba(14, 165, 233, 0.15); color: #7dd3fc; box-shadow: inset 0 0 0 1px rgba(56, 189, 248, 0.2); }
    .badge-mode-permanent { background: rgba(239, 68, 68, 0.15); color: #fca5a5; box-shadow: inset 0 0 0 1px rgba(248, 113, 113, 0.2); }
  }
  .notes { margin-top: 16px; padding: 16px; }
  .notes h2 { font-size: 14px; font-weight: 600; }
  .notes ul { margin: 8px 0 0; padding-left: 20px; font-size: 12px; color: var(--muted); }
  .notes li { margin-top: 2px; }
  .footer { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; margin-top: 16px; font-size: 11px; color: var(--muted-2); }
  @media (max-width: 900px) {
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 640px) {
    .volumes { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="card hero">
    <p class="eyebrow">Windows Disk Cleanup · Cleanup Report</p>
    <h1>清理报告</h1>
    <p class="root-line">
      <span class="root-tag">ROOT</span>
      <span id="rootPath" class="root-path">—</span>
    </p>
    <div id="metaChips" class="meta-chips"></div>
  </header>

  <section class="stats">
    <div class="card stat-card accent-emerald">
      <div class="stat-label">已处理空间</div>
      <div id="freedValue" class="stat-value">—</div>
      <div class="stat-sub">按删除前逻辑大小统计；回收站清空后才真正释放</div>
    </div>
    <div class="card stat-card accent-zinc">
      <div class="stat-label">选中条目</div>
      <div id="selectedValue" class="stat-value">0</div>
      <div class="stat-sub">来自扫描报告的选择</div>
    </div>
    <div class="card stat-card accent-emerald">
      <div class="stat-label">成功删除 / 移入回收站</div>
      <div id="deletedValue" class="stat-value">0</div>
      <div class="stat-sub">完全移除的条目</div>
    </div>
    <div class="card stat-card accent-red">
      <div class="stat-label">失败 / 部分删除</div>
      <div id="failedValue" class="stat-value">0</div>
      <div class="stat-sub">需要人工处理</div>
    </div>
  </section>

  <section class="volumes">
    <div class="card volume-card">
      <h3>删除前磁盘</h3>
      <div class="track"><div id="barBefore"></div></div>
      <div class="volume-row"><span>可用</span><strong id="freeBefore">—</strong></div>
      <div class="volume-row"><span>已用 / 总量</span><strong id="usedBefore">—</strong></div>
    </div>
    <div class="card volume-card">
      <h3>删除后磁盘</h3>
      <div class="track"><div id="barAfter"></div></div>
      <div class="volume-row"><span>可用</span><strong id="freeAfter">—</strong></div>
      <div class="volume-row"><span>已用 / 总量</span><strong id="usedAfter">—</strong></div>
    </div>
  </section>

  <section class="card results">
    <div class="results-head">
      <h2>逐项结果</h2>
      <a href="report.html" class="link">查看扫描报告 →</a>
    </div>
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>目录 / 文件</th>
            <th>建议</th>
            <th class="right">大小</th>
            <th>方式</th>
            <th>结果</th>
            <th class="right">释放 / 移入</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </section>

  <section class="card notes">
    <h2>说明</h2>
    <ul id="notesList"></ul>
  </section>

  <div class="footer">
    <span id="generated"></span>
    <span>windows-disk-cleanup · 只删除用户勾选并确认的条目 · 单文件离线报告，无网络请求</span>
  </div>
</div>

<script>
const DATA = /*__WINDOWS_DISK_CLEANUP_DATA__*/;
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const d = DATA;

  function fmtBytes(v) {
    if (v === null || v === undefined || Number.isNaN(v)) return "—";
    const u = ["B", "KB", "MB", "GB", "TB"];
    let n = Number(v), i = 0;
    while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
    return i === 0 ? Math.round(n) + " B" : n.toFixed(1) + " " + u[i];
  }
  function fmtTime(v) {
    if (!v) return "—";
    const x = new Date(v);
    return Number.isNaN(x.getTime()) ? v : x.toLocaleString("zh-CN", { hour12: false });
  }
  function chip(label, value) {
    const el = document.createElement("span");
    el.className = "chip";
    el.appendChild(document.createTextNode(label + " "));
    const b = document.createElement("strong");
    b.textContent = value;
    el.appendChild(b);
    return el;
  }
  function badge(text, cls) {
    const el = document.createElement("span");
    el.className = "badge " + cls;
    el.textContent = text;
    return el;
  }
  function setBar(id, v) {
    const pct = (v && v.used_pct !== null && v.used_pct !== undefined) ? v.used_pct : 0;
    paintUsage($(id), pct);
  }

  // 使用率分档：颜色内联写死，不依赖任何运行时样式库。
  const USAGE_TIERS = [
    { below: 60, from: "#10b981", to: "#34d399" },
    { below: 80, from: "#f59e0b", to: "#fbbf24" },
    { below: 90, from: "#f97316", to: "#fb923c" },
    { below: 101, from: "#ef4444", to: "#f87171" },
  ];

  function usageTier(pct) {
    for (const tier of USAGE_TIERS) {
      if (pct < tier.below) return tier;
    }
    return USAGE_TIERS[USAGE_TIERS.length - 1];
  }

  function paintUsage(barEl, pct) {
    const p = Math.max(0, Math.min(100, Number(pct) || 0));
    const tier = usageTier(p);
    barEl.style.width = p + "%";
    barEl.style.background = "linear-gradient(90deg, " + tier.from + ", " + tier.to + ")";
    barEl.style.boxShadow = p >= 80 ? "0 0 10px " + tier.to + "66" : "";
    barEl.title = "已用 " + p.toFixed(1) + "%";
  }

  $("rootPath").textContent = d.root_display || d.root || "—";
  const chips = $("metaChips");
  chips.appendChild(chip("清理时间", fmtTime(d.started_at)));
  chips.appendChild(chip("耗时", (d.duration_s || 0).toFixed(1) + " s"));
  const items = d.items || [];
  const recycled = items.filter((i) => i.mode === "recycle").length;
  const permanented = items.filter((i) => i.mode === "permanent").length;
  chips.appendChild(chip("回收站", recycled));
  chips.appendChild(chip("彻底删除", permanented));
  chips.appendChild(chip("扫描 ID", d.scan_id || "—"));
  chips.appendChild(chip("选择已确认", d.confirmed ? "是" : "否"));

  const s = d.summary || {};
  $("freedValue").textContent = s.moved_bytes_h || "—";
  $("selectedValue").textContent = s.selected || 0;
  $("deletedValue").textContent = s.deleted || 0;
  $("failedValue").textContent = (s.failed || 0) + (s.partial || 0);

  const before = d.volume_before || {}, after = d.volume_after || {};
  setBar("barBefore", before);
  setBar("barAfter", after);
  $("freeBefore").textContent = before.free_h || "—";
  $("freeAfter").textContent = after.free_h || "—";
  $("usedBefore").textContent = (before.used_h || "—") + " / " + (before.total_h || "—");
  $("usedAfter").textContent = (after.used_h || "—") + " / " + (after.total_h || "—");

  const tbody = $("tbody");
  for (const item of items) {
    const tr = document.createElement("tr");

    const tdPath = document.createElement("td");
    tdPath.className = "cell-path";
    const title = document.createElement("div");
    title.className = "item-title";
    title.textContent = item.title || "目录";
    const path = document.createElement("div");
    path.className = "item-path";
    path.textContent = item.path || "";
    tdPath.appendChild(title);
    tdPath.appendChild(path);
    if (item.error) {
      const err = document.createElement("div");
      err.className = "item-error";
      err.textContent = item.error;
      tdPath.appendChild(err);
    }
    tr.appendChild(tdPath);

    const tdRec = document.createElement("td");
    tdRec.appendChild(badge(item.recommendation_label || "—", "badge-muted"));
    tr.appendChild(tdRec);

    const tdSize = document.createElement("td");
    tdSize.className = "right mono nowrap";
    tdSize.textContent = item.size_h || "—";
    tr.appendChild(tdSize);

    const tdMode = document.createElement("td");
    tdMode.appendChild(badge(
      item.mode === "permanent" ? "彻底删除" : "回收站",
      item.mode === "permanent" ? "badge-mode-permanent" : "badge-mode-recycle"
    ));
    tr.appendChild(tdMode);

    const tdStatus = document.createElement("td");
    tdStatus.appendChild(badge(item.status_label || item.status || "—", item.status_class || "badge-muted"));
    tr.appendChild(tdStatus);

    const tdFreed = document.createElement("td");
    tdFreed.className = "right mono nowrap";
    tdFreed.textContent = item.freed_h || "—";
    tr.appendChild(tdFreed);

    tbody.appendChild(tr);
  }

  const notes = $("notesList");
  const base = (d.notes || []).slice();
  for (const n of base) {
    const li = document.createElement("li");
    li.textContent = n;
    notes.appendChild(li);
  }
  $("generated").textContent = "报告生成：" + fmtTime(d.generated_at) + " · 规则库：" + (d.rules_version || "—");
})();
</script>
</body>
</html>
