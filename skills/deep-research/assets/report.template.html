<!DOCTYPE html>
<html lang="zh-CN"__THEME_ATTR__>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>__TITLE__</title>
<style>
/* ===== 主题变量：default 跟随系统；dark / sepia 强制 ===== */
/* 极简黑白灰：除主题色（--brand/--brand-2）外，表面/文字/线条一律中性灰阶 */
:root {
  --brand: #0b6fd8; --brand-2: #6d28d9;
  --paper: #ffffff; --paper-2: #f5f5f5; --ink: #111111; --muted: #525252;
  --line: #d4d4d4; --card: #f7f7f7; --code-bg: #f0f0f0;
  --shadow: 0 1px 3px rgba(0,0,0,.07);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    --brand: #1a88ff; --brand-2: #b9a3f3;
    --paper: #121212; --paper-2: #1c1c1c; --ink: #f5f5f5; --muted: #b0b0b0;
    --line: #404040; --card: #1a1a1a; --code-bg: #202020;
    --shadow: 0 1px 3px rgba(0,0,0,.5);
  }
}
:root[data-theme="light"] {
  --brand: #0b6fd8; --brand-2: #6d28d9;
  --paper: #ffffff; --paper-2: #f5f5f5; --ink: #111111; --muted: #525252;
  --line: #d4d4d4; --card: #f7f7f7; --code-bg: #f0f0f0;
  --shadow: 0 1px 3px rgba(0,0,0,.07);
}
:root[data-theme="dark"] {
  --brand: #1a88ff; --brand-2: #b9a3f3;
  --paper: #121212; --paper-2: #1c1c1c; --ink: #f5f5f5; --muted: #b0b0b0;
  --line: #404040; --card: #1a1a1a; --code-bg: #202020;
  --shadow: 0 1px 3px rgba(0,0,0,.5);
}
:root[data-theme="sepia"] {
  --brand: #9a6700; --brand-2: #6d28d9;
  --paper: #faf3e3; --paper-2: #f3ead2; --ink: #2e2620; --muted: #6b6050;
  --line: #d8ccb2; --card: #f3ead2; --code-bg: #ece1c6;
  --shadow: 0 1px 3px rgba(59,50,40,.1);
}

/* ===== 基础排版 ===== */
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 24px; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  font-size: 16px; line-height: 1.9;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; font-kerning: normal;
}
.layout { display: grid; grid-template-columns: 264px minmax(0, 1fr); gap: 40px;
  max-width: 1240px; margin: 0 auto; padding: 32px 28px 80px; }
article { max-width: 80ch; min-width: 0; }
h1 { font-size: 27px; line-height: 1.45; margin: 0 0 10px; letter-spacing: .01em; font-weight: 700; }
h2 { font-size: 21px; line-height: 1.5; margin: 2.4em 0 .8em; padding-bottom: 10px;
  border-bottom: 1px solid var(--line); font-weight: 700; }
h3 { font-size: 17px; line-height: 1.5; margin: 1.8em 0 .6em; font-weight: 650; }
p { margin: 0 0 1.1em; }
a { color: var(--brand); text-decoration: none; }
a:hover { text-decoration: underline; }
strong { font-weight: 650; color: var(--brand); }
hr { border: none; border-top: 1px solid var(--line); margin: 32px 0; }

/* ===== 滚动条：细轨、圆角、随主题 ===== */
* { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; border: 2px solid var(--paper); }
::-webkit-scrollbar-thumb:hover { background: var(--muted); }
#toc { scrollbar-width: thin; }
#toc::-webkit-scrollbar { width: 6px; }
#toc::-webkit-scrollbar-thumb { border: none; }
code { font-family: Consolas, "Cascadia Code", "Courier New", monospace; font-size: .88em;
  background: var(--code-bg); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; }
pre { background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px;
  padding: 14px 16px; overflow-x: auto; line-height: 1.6; }
pre code { background: none; border: none; padding: 0; font-size: .86em; }
blockquote { margin: 1.3em 0; padding: 12px 20px; border-left: 3px solid var(--brand);
  background: var(--card); border-radius: 0 8px 8px 0; color: var(--muted); }
blockquote p { margin: 0 0 .6em; }
blockquote p:last-child { margin-bottom: 0; }
ul, ol { padding-left: 24px; margin: 0 0 1.1em; }
li { margin: .4em 0; }
li::marker { color: var(--muted); }

/* ===== 头部与页脚 ===== */
.doc-header { border-bottom: 1px solid var(--line); padding-bottom: 18px; margin-bottom: 8px; }
.kicker { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
/* 主题分段控件：四段图标、选中段浮起 + 主题色 */
.theme-switch { float: right; display: inline-flex; gap: 2px; padding: 3px;
  border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
.theme-switch button { display: grid; place-items: center; width: 28px; height: 26px;
  border: none; border-radius: 7px; background: transparent; color: var(--muted);
  cursor: pointer; padding: 0; transition: color .15s, background .15s; }
.theme-switch button:hover { color: var(--ink); background: color-mix(in srgb, var(--muted) 12%, transparent); }
.theme-switch button[aria-pressed="true"] { color: var(--brand); background: var(--paper);
  box-shadow: 0 1px 2px rgba(0,0,0,.14); }
.theme-switch svg { width: 15px; height: 15px; display: block; }
footer { margin-top: 56px; padding-top: 16px; border-top: 1px solid var(--line); }
footer .note { font-size: 12px; line-height: 1.7; color: color-mix(in srgb, var(--muted) 72%, var(--paper)); }

/* ===== 目录侧栏 ===== */
#toc { position: sticky; top: 24px; align-self: start; max-height: calc(100vh - 48px);
  overflow-y: auto; font-size: 13px; padding-right: 8px; }
#toc .toc-title { font-size: 12px; letter-spacing: .12em; color: var(--muted);
  text-transform: uppercase; margin-bottom: 10px; }
/* 层级虚线：一级虚线主轴 + 二级（h3）嵌套虚线缩进导轨 */
#toc ul { list-style: none; margin: 0; padding: 0; border-left: 1px dashed var(--line); }
#toc li { margin: 0; position: relative; }
#toc li.toc-h3::before { content: ""; position: absolute; left: 14px; top: 3px; bottom: 3px;
  border-left: 1px dashed var(--line); }
#toc a { display: block; padding: 4px 12px 4px 14px; color: var(--muted); border-left: 2px solid transparent;
  margin-left: -1px; line-height: 1.5; text-decoration: none; }
#toc li.toc-h3 a { padding-left: 30px; font-size: 12.5px; }
#toc a:hover { color: var(--ink); text-decoration: none; }
#toc a.active { color: var(--brand); border-left-color: var(--brand); font-weight: 600; }
#toc-mobile { display: none; }

/* ===== 摘要结论卡片 ===== */
article > ul:first-of-type { list-style: none; padding: 6px 0; margin: 18px 0;
  background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
article > ul:first-of-type > li { position: relative; padding: 13px 22px 13px 36px; margin: 0;
  border-bottom: 1px solid var(--line); line-height: 1.85; }
article > ul:first-of-type > li:last-child { border-bottom: none; }
article > ul:first-of-type > li::before { content: "▸"; position: absolute; left: 16px; color: var(--brand); }

/* ===== 引用上标与来源锚点 ===== */
sup { font-size: .72em; line-height: 0; }
sup a.cite { color: var(--brand); padding: 0 1px; white-space: nowrap; }
sup a.cite:hover { text-decoration: underline; }
tr[id^="src-"]:target { background: color-mix(in srgb, var(--brand) 14%, transparent); }
tr[id^="src-"]:target td:first-child { box-shadow: inset 3px 0 0 var(--brand); }
a.backref { margin-left: 6px; font-size: .85em; color: var(--muted); }
a.backref:hover { color: var(--brand); }
sup a.cite:target, a.cite:target { background: color-mix(in srgb, var(--brand) 22%, transparent); border-radius: 3px; }

/* ===== 表格 ===== */
.table-wrap { overflow-x: auto; margin: 16px 0; border: 1px solid var(--line); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; font-variant-numeric: tabular-nums; }
th, td { border-bottom: 1px solid var(--line); padding: 8px 12px; text-align: left; vertical-align: top; }
th { background: var(--paper-2); font-weight: 650; white-space: nowrap; }
tr:last-child td { border-bottom: none; }
tbody tr:nth-child(even) { background: color-mix(in srgb, var(--paper-2) 55%, transparent); }
td.src-id { white-space: nowrap; font-weight: 600; color: var(--muted); }

/* ===== 徽章 ===== */
.badge { display: inline-block; font-size: 11.5px; line-height: 1.5; padding: 1px 9px;
  border-radius: 999px; white-space: nowrap; font-weight: 500; }
/* 徽章保持灰阶，仅用边框/字重区分语义；主题色只留给链接与引用 */
.b-official { color: var(--ink); background: color-mix(in srgb, var(--muted) 12%, transparent); border: 1px solid var(--line); }
.b-firsthand { color: var(--ink); background: color-mix(in srgb, var(--muted) 12%, transparent); border: 1px solid var(--muted); }
.b-media { color: var(--muted); background: color-mix(in srgb, var(--muted) 10%, transparent); border: 1px solid var(--line); }
.b-community { color: var(--muted); background: transparent; border: 1px solid var(--line); }
.b-single { color: var(--ink); background: color-mix(in srgb, var(--muted) 16%, transparent); border: 1px solid var(--muted); font-weight: 600; }
.b-infer { color: var(--muted); border: 1px dashed var(--muted); background: transparent; }

/* ===== 响应式 ===== */
@media (max-width: 1079px) {
  .layout { grid-template-columns: 1fr; gap: 0; padding: 20px 18px 60px; }
  #toc { display: none; }
  #toc-mobile { display: block; margin: 14px 0 6px; border: 1px solid var(--line);
    border-radius: 10px; background: var(--card); font-size: 13.5px; }
  #toc-mobile summary { cursor: pointer; padding: 10px 16px; font-weight: 600; color: var(--muted); }
  #toc-mobile ul { list-style: none; margin: 0; padding: 0 16px 12px; }
  #toc-mobile li { margin: 0; }
  #toc-mobile li.toc-h3 { padding-left: 16px; }
  #toc-mobile a { display: block; padding: 3px 0; color: var(--muted); }
}

/* ===== 打印 ===== */
@media print {
  :root, :root[data-theme="dark"], :root[data-theme="sepia"] {
    --brand: #0b6fd8; --brand-2: #6b3fc4;
    --paper: #ffffff; --paper-2: #f4f4f4; --ink: #141414; --muted: #4d4d4d;
    --line: #cccccc; --card: #f4f4f4; --code-bg: #efefef;
    --shadow: none;
  }
  body { font-size: 10.5pt; line-height: 1.7; }
  strong { color: var(--brand); }
  .layout { display: block; max-width: none; padding: 0; }
  #toc, #toc-mobile, .theme-switch, a.backref { display: none !important; }
  article { max-width: none; }
  h2 { break-after: avoid; }
  table, blockquote, pre, article > ul:first-of-type > li { break-inside: avoid; }
  .table-wrap { overflow: visible; border: none; }
  a[href^="http"]::after { content: "（" attr(href) "）"; font-size: .8em; color: var(--muted); word-break: break-all; }
  sup a.cite::after { content: none; }
  @page { margin: 18mm 16mm; }
}
</style>
</head>
<body>
<div class="layout">
<nav id="toc" aria-label="目录">
  <div class="toc-title">目录</div>
  <ul>
__TOC_ITEMS__
  </ul>
</nav>
<main>
<details id="toc-mobile"><summary>目录</summary><ul>
__TOC_ITEMS__
</ul></details>
<article>
<header class="doc-header">
  <div class="theme-switch" id="theme-switch" role="group" aria-label="主题切换">
    <button type="button" data-theme-choice="" title="自动（跟随系统）" aria-pressed="true">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <circle cx="8" cy="8" r="5.4"/><path d="M8 2.6a5.4 5.4 0 0 1 0 10.8z" fill="currentColor" stroke="none"/>
      </svg>
    </button>
    <button type="button" data-theme-choice="light" title="浅色" aria-pressed="false">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
        <circle cx="8" cy="8" r="3"/><path d="M8 1.2v1.9M8 12.9v1.9M1.2 8h1.9M12.9 8h1.9M3.2 3.2l1.4 1.4M11.4 11.4l1.4 1.4M12.8 3.2l-1.4 1.4M4.6 11.4l-1.4 1.4"/>
      </svg>
    </button>
    <button type="button" data-theme-choice="dark" title="深色" aria-pressed="false">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true">
        <path d="M13.4 9.6A5.6 5.6 0 0 1 6.4 2.6a5.6 5.6 0 1 0 7 7z"/>
      </svg>
    </button>
    <button type="button" data-theme-choice="sepia" title="暖纸" aria-pressed="false">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true">
        <path d="M3.8 2.2h5.4l3 3v8.6H3.8z"/><path d="M9.2 2.2v3h3"/>
      </svg>
    </button>
  </div>
  <div class="kicker">deep-research · 调研报告</div>
  <h1>__TITLE__</h1>
</header>
__CONTENT__
<footer>
  <div class="note">本报告为信息整理；来源证据与调研元信息见文末附录 A / B。</div>
</footer>
</article>
</main>
</div>
<script>
(function () {
  "use strict";
  /* 主题分段控件：自动 / 浅色 / 深色 / 暖纸，记忆选择 */
  var root = document.documentElement;
  var buttons = Array.prototype.slice.call(document.querySelectorAll(".theme-switch button"));
  function current() { return root.getAttribute("data-theme") || ""; }
  function sync() {
    var cur = current();
    buttons.forEach(function (b) {
      b.setAttribute("aria-pressed", String((b.getAttribute("data-theme-choice") || "") === cur));
    });
  }
  function apply(t) {
    if (t) { root.setAttribute("data-theme", t); } else { root.removeAttribute("data-theme"); }
    sync();
    try { localStorage.setItem("dr-theme", t); } catch (e) {}
  }
  var saved = "";
  try { saved = localStorage.getItem("dr-theme") || ""; } catch (e) {}
  if (!root.getAttribute("data-theme") && saved) { apply(saved); } else { sync(); }
  buttons.forEach(function (b) {
    b.addEventListener("click", function () { apply(b.getAttribute("data-theme-choice") || ""); });
  });

  /* 表格横向滚动包装（渐进增强，无 JS 时表格仍可读） */
  document.querySelectorAll("article table").forEach(function (t) {
    var w = document.createElement("div");
    w.className = "table-wrap";
    t.parentNode.insertBefore(w, t);
    w.appendChild(t);
  });

  /* 目录当前节高亮：取“最后一个越过阅读线的标题”，段落中间也不熄灯 */
  var links = Array.prototype.slice.call(document.querySelectorAll("#toc a"));
  if (links.length) {
    var entries = [];
    links.forEach(function (a) {
      var el = document.getElementById(a.getAttribute("href").slice(1));
      if (el) { entries.push({ link: a, el: el }); }
    });
    var activeLink = null;
    var ticking = false;
    function updateActive() {
      ticking = false;
      var line = 140;  /* 阅读线：距视口顶部约两行标题高 */
      var active = entries.length ? entries[0].link : null;
      for (var i = 0; i < entries.length; i++) {
        if (entries[i].el.getBoundingClientRect().top <= line) { active = entries[i].link; }
        else { break; }
      }
      if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 2) {
        active = entries.length ? entries[entries.length - 1].link : active;
      }
      if (active !== activeLink) {
        if (activeLink) { activeLink.classList.remove("active"); }
        if (active) { active.classList.add("active"); }
        activeLink = active;
      }
    }
    window.addEventListener("scroll", function () {
      if (!ticking) { ticking = true; requestAnimationFrame(updateActive); }
    }, { passive: true });
    window.addEventListener("resize", updateActive);
    updateActive();
  }
})();
</script>
</body>
</html>
