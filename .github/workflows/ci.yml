name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: lint + link/doctor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: skills-lint
        run: bash scripts/skills-lint.sh
      - name: link + doctor
        run: |
          mkdir -p "$HOME/.agents/skills"
          bash scripts/skills-link.sh --agent agents --all
          bash scripts/skills-doctor.sh

  ds-web-access:
    name: ds-web-access unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: unittest
        run: python -m unittest discover -s skills/ds-web-access/tests

  md2pdf:
    name: md2pdf unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: unittest
        run: uv run --project skills/md2pdf python -m unittest discover -s skills/md2pdf/tests

  deep-research:
    name: deep-research renderer unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: unittest
        run: uv run --with markdown-it-py --with pygments --with latex2mathml python -m unittest discover -s skills/deep-research/tests
      - name: render --help smoke
        run: uv run skills/deep-research/scripts/render_report.py --help

  video-insight:
    name: video-insight unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: unittest
        run: python -m unittest discover -s skills/video-insight/tests

  windows-disk-cleanup:
    name: windows-disk-cleanup unit tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: unittest
        run: python -m unittest discover -s skills/windows-disk-cleanup/tests
