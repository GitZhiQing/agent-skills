name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: lint + link/doctor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: skills-lint
        run: bash scripts/skills-lint.sh
      - name: link + doctor
        run: |
          mkdir -p "$HOME/.agents/skills"
          bash scripts/skills-link.sh --agent agents --all
          bash scripts/skills-doctor.sh

  video-insight:
    name: video-insight unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: unittest
        run: python -m unittest discover -s skills/video-insight/tests
